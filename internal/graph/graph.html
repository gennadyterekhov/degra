<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф импортов · degra</title>
<style>
  :root {
    color-scheme: light;
    --ink: #19253a;
    --muted: #53627a;
    --line: #dce2ea;
    --selected: #233e88;
    --direct: #087b69;
    --transitive: #ab4c11;
    font: 15px/1.5 system-ui, sans-serif;
    color: var(--ink);
    background: #f6f8fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header { background: #19253a; color: #fff; padding: 14px 24px; display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  #summary { color: #cbd5e7; }
  main { display: grid; grid-template-columns: minmax(245px, 310px) minmax(0, 1fr); min-height: calc(100dvh - 58px); }
  aside { background: #fff; padding: 20px; border-right: 1px solid var(--line); }
  label { display: block; font-weight: 650; margin-bottom: 6px; }
  input, button { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  input { width: 100%; padding: 8px 10px; }
  button { padding: 5px 10px; cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--selected); }
  p { margin: 8px 0; }
  #results { display: grid; gap: 4px; max-height: 35vh; overflow: auto; }
  #results button { text-align: left; overflow-wrap: anywhere; }
  #details { margin-top: 17px; padding-top: 12px; border-top: 1px solid var(--line); }
  #selection { font-weight: 650; overflow-wrap: anywhere; }
  .muted { color: var(--muted); font-size: 13px; }
  .legend { display: flex; gap: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; background: var(--dot); }
  .selected { --dot: var(--selected); }
  .direct { --dot: var(--direct); }
  .transitive { --dot: var(--transitive); }
  #workspace { display: flex; flex-direction: column; min-width: 0; }
  #toolbar { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #toolbar .legend { margin-left: auto; }
  #viewport { position: relative; flex: 1; min-height: 340px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; position: absolute; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hover { position: absolute; pointer-events: none; bottom: 12px; left: 12px; max-width: calc(100% - 24px); padding: 6px 10px; background: #19253a; color: #fff; border-radius: 6px; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  @media (max-width: 680px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; }
    #results { max-height: 25vh; }
    #viewport { min-height: 55vh; }
  }
</style>
</head>
<body>
<header><h1>Граф импортов</h1><span id="summary"></span></header>
<main>
  <aside>
    <label for="search">Найти файл</label>
    <input id="search" type="search" placeholder="Имя или часть пути" autocomplete="off">
    <p id="match-count" class="muted" aria-live="polite"></p>
    <div id="results"></div>
    <section id="details" aria-live="polite">
      <p id="selection">Файл не выбран</p>
      <p id="importer-count" class="muted">Нажмите на папку, чтобы раскрыть файлы. Выберите файл, чтобы увидеть его импортёров.</p>
    </section>
  </aside>
  <section id="workspace" aria-label="Граф зависимостей">
    <div id="toolbar">
      <button type="button" id="fit">Весь граф</button>
      <button type="button" id="zoom-in" aria-label="Увеличить">+</button>
      <button type="button" id="zoom-out" aria-label="Уменьшить">−</button>
      <div class="legend"><span class="selected">Выбранный</span><span class="direct">Прямые</span><span class="transitive">Транзитивные</span></div>
    </div>
    <div id="viewport"><canvas aria-label="Узлы и связи графа"></canvas><div id="hover" hidden></div></div>
  </section>
</main>
<script type="application/json" id="graph-data">{{ . }}</script>
<script>
"use strict";
const byID = id => document.getElementById(id);
const graph = JSON.parse(byID("graph-data").textContent);
const names = Object.keys(graph).sort();
const edges = names.flatMap(from => graph[from].map(to => [from, to]));
const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");
const search = byID("search");
const results = byID("results");
const hover = byID("hover");
const ink = { selected: "#233e88", direct: "#087b69", transitive: "#ab4c11" };
let selected = null;
let direct = new Set();
let width = 1, height = 1, scale = 1, offsetX = 0, offsetY = 0;
let matches = [];
let drag = null;

function indexFolders() {
  const folders = new Map();
  const folderByFile = new Map();
  for (const name of names) {
    const slash = name.indexOf("/");
    const directory = slash < 0 ? "" : name.slice(0, slash);
    if (!folders.has(directory)) {
      folders.set(directory, { id: Symbol(directory), name: directory || "Корень проекта", files: [] });
    }
    const folder = folders.get(directory);
    folder.files.push(name);
    folderByFile.set(name, folder);
  }
  return { folders, folderByFile };
}

const { folders, folderByFile } = indexFolders();
const expanded = new Set();

function overviewLayout() {
  const points = new Map();
  const blocks = [];
  const rowWidth = Math.max(560, Math.sqrt(names.length) * 36);
  let x = 0, y = 0, rowHeight = 0, maxX = 0;
  for (const folder of folders.values()) {
    const open = expanded.has(folder.id);
    const columns = Math.min(Math.ceil(Math.sqrt(folder.files.length / 2)), Math.floor((rowWidth - 24) / 152));
    const w = Math.max(168, open ? columns * 152 + 24 : 168);
    const h = open ? Math.ceil(folder.files.length / columns) * 26 + 46 : 84;
    if (x && x + w > rowWidth) {
      x = 0;
      y += rowHeight + 18;
      rowHeight = 0;
    }
    blocks.push({ folder, open, x, y, w, h });
    if (open) {
      folder.files.forEach((name, i) => points.set(name, {
        x: x + 16 + i % columns * 152, y: y + 51 + Math.floor(i / columns) * 26,
      }));
    } else {
      points.set(folder.id, { x: x + w / 2, y: y + 63, folder });
    }
    maxX = Math.max(maxX, x + w);
    x += w + 18;
    rowHeight = Math.max(rowHeight, h);
  }
  const counts = new Map();
  for (const [from, to] of edges) {
    const source = displayedNode(from);
    const target = displayedNode(to);
    if (source === target && typeof source === "symbol") continue;
    if (!counts.has(source)) counts.set(source, new Map());
    const targets = counts.get(source);
    targets.set(target, (targets.get(target) ?? 0) + 1);
  }
  const visibleEdges = [];
  for (const [from, targets] of counts) {
    for (const [to, count] of targets) {
      const bidirectional = from !== to && counts.get(to)?.has(from);
      visibleEdges.push([from, to, count, bidirectional]);
    }
  }
  return { points, blocks, w: Math.max(1, maxX), h: Math.max(1, y + rowHeight), edges: visibleEdges };
}

function displayedNode(name) {
  const folder = folderByFile.get(name);
  return expanded.has(folder.id) ? name : folder.id;
}

let overview = overviewLayout();
let scene = overview;
byID("summary").textContent = `${names.length} файлов · ${edges.length} связей`;

function importerLayout(root) {
  const columns = [[root]];
  const depth = new Map([[root, 0]]);
  const visibleEdges = [];
  for (let level = 0; level < columns.length; level++) {
    for (const name of columns[level]) {
      for (const importer of graph[name]) {
        visibleEdges.push([name, importer]);
        if (depth.has(importer)) continue;
        depth.set(importer, level + 1);
        (columns[level + 1] ??= []).push(importer);
      }
    }
  }

  const incoming = new Map();
  const outgoing = new Map();
  for (const column of columns) {
    column.sort();
    for (const name of column) {
      incoming.set(name, []);
      outgoing.set(name, []);
    }
  }
  for (const [from, to] of visibleEdges) {
    if (depth.get(to) !== depth.get(from) + 1) continue;
    incoming.get(to).push(from);
    outgoing.get(from).push(to);
  }
  orderColumns(columns, incoming, outgoing);

  const points = new Map();
  const blocks = [];
  const tallest = columns.reduce((height, column) => Math.max(height, column.length), 0);
  const h = tallest * 36 + 40;
  const w = columns.length * 224 - 16;
  columns.forEach((column, level) => {
    const x = level * 224;
    const group = level === 0 ? "Выбранный файл" : level === 1 ? "Прямые импортёры" : `Шаг ${level}`;
    blocks.push({ group, x, y: 0, w: 208, h });
    column.forEach((name, i) => points.set(name, {
      x: x + 104, y: 48 + (tallest - column.length) * 18 + i * 36,
    }));
  });
  return { points, blocks, w, h, edges: visibleEdges, depth };
}

// Count inversions between adjacent columns. Edges with a shared endpoint
// have equal positions or are processed together, so they do not count.
function crossings(columns, outgoing) {
  let count = 0;
  for (let level = 0; level + 1 < columns.length; level++) {
    const next = columns[level + 1];
    const rank = new Map(next.map((name, i) => [name, i + 1]));
    const tree = new Array(next.length + 1).fill(0);
    let seen = 0;
    for (const from of columns[level]) {
      const positions = outgoing.get(from).map(to => rank.get(to));
      for (const position of positions) {
        let prefix = 0;
        for (let i = position; i > 0; i -= i & -i) prefix += tree[i];
        count += seen - prefix;
      }
      for (const position of positions) {
        for (let i = position; i < tree.length; i += i & -i) tree[i]++;
      }
      seen += positions.length;
    }
  }
  return count;
}

function orderColumns(columns, incoming, outgoing) {
  let minimum = crossings(columns, outgoing);
  let best = columns.map(column => column.slice());
  for (let pass = 0; pass < 8 && minimum > 0; pass++) {
    const forward = pass % 2 === 0;
    const step = forward ? 1 : -1;
    for (let level = forward ? 1 : columns.length - 2;
      level >= 0 && level < columns.length; level += step) {
      const neighborColumn = columns[level - step];
      const rank = new Map(neighborColumn.map((name, i) => [name, (i + 0.5) / neighborColumn.length]));
      const neighbors = forward ? incoming : outgoing;
      const column = columns[level];
      const score = new Map(column.map((name, i) => {
        const adjacent = neighbors.get(name);
        const mean = adjacent.length
          ? adjacent.reduce((sum, other) => sum + rank.get(other), 0) / adjacent.length
          : (i + 0.5) / column.length;
        return [name, mean];
      }));
      column.sort((a, b) => score.get(a) - score.get(b));
    }
    const count = crossings(columns, outgoing);
    if (count < minimum) {
      minimum = count;
      best = columns.map(column => column.slice());
    }
  }
  columns.splice(0, columns.length, ...best);
}

function draw() {
  const ratio = canvas.width / width;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);
  for (const block of scene.blocks) {
    ctx.fillStyle = block.folder && !block.open ? "#e6edf7" : "#edf2f8";
    ctx.fillRect(block.x, block.y, block.w, block.h);
  }

  function edge(from, to, back, bidirectional) {
    const a = scene.points.get(from);
    const b = scene.points.get(to);
    let middle = null;
    ctx.beginPath();
    if (from === to) {
      ctx.arc(a.x + 5, a.y - 5, 6, 0, 2 * Math.PI);
    } else {
      const direction = Math.atan2(b.y - a.y, b.x - a.x);
      const control = back ? { x: Math.max(a.x, b.x) + 45, y: a.y }
        : bidirectional ? {
          x: (a.x + b.x) / 2 - Math.sin(direction) * 28,
          y: (a.y + b.y) / 2 + Math.cos(direction) * 28,
        } : null;
      const angle = control ? Math.atan2(b.y - control.y, b.x - control.x) : direction;
      const endX = b.x - Math.cos(angle) * 6;
      const endY = b.y - Math.sin(angle) * 6;
      ctx.moveTo(a.x, a.y);
      if (control) ctx.quadraticCurveTo(control.x, control.y, endX, endY);
      else ctx.lineTo(endX, endY);
      for (const side of [-1, 1]) {
        const tip = angle + side * 0.55;
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - Math.cos(tip) * 5, endY - Math.sin(tip) * 5);
      }
      middle = control ? { x: (a.x + endX + 2 * control.x) / 4, y: (a.y + endY + 2 * control.y) / 4 }
        : { x: (a.x + endX) / 2, y: (a.y + endY) / 2 };
    }
    ctx.stroke();
    return middle;
  }

  const edgeLabels = [];
  for (const [from, to, count, bidirectional] of scene.edges) {
    const back = scene.depth && scene.depth.get(to) <= scene.depth.get(from);
    const fromFolder = typeof from === "symbol";
    const toFolder = typeof to === "symbol";
    const grouped = fromFolder || toFolder;
    ctx.lineWidth = grouped ? Math.min(4, 1.2 + Math.log2(count) * 0.6) : 1.2;
    ctx.strokeStyle = selected === null ? grouped ? "#536987" : "#798ba271"
      : back ? "#798ba2" : from === selected ? ink.direct : ink.transitive;
    ctx.setLineDash(back ? [4, 3] : []);
    const middle = edge(from, to, back, bidirectional);
    if (middle && (fromFolder && toFolder || count > 1)) edgeLabels.push({ ...middle, count });
  }
  ctx.setLineDash([]);

  for (const block of scene.blocks) {
    if (!block.folder && scale < 0.65) continue;
    const label = block.folder ? (block.open ? "− " : "+ ") + block.folder.name : block.group;
    drawLabel(label, block.x + 10, block.y + 17, block.w - 20, "start");
    if (block.folder && !block.open) {
      drawLabel(`${block.folder.files.length} файлов`, block.x + 10, block.y + 38, block.w - 20, "start");
    }
  }
  for (const [name, point] of scene.points) {
    ctx.fillStyle = name === selected ? ink.selected
      : direct.has(name) ? ink.direct
      : selected === null ? "#647c9b" : ink.transitive;
    ctx.beginPath();
    ctx.arc(point.x, point.y, name === selected || point.folder ? 7 : 4.5, 0, 2 * Math.PI);
    ctx.fill();
    if (!point.folder && scale >= 0.65) {
      const basename = name.slice(name.lastIndexOf("/") + 1);
      if (selected === null) drawLabel(basename, point.x + 8, point.y + 4, 133, "start");
      else drawLabel(basename, point.x, point.y - 9, 194, "center");
    }
  }
  for (const { x, y, count } of edgeLabels) drawLabel(String(count), x, y - 3, 90, "center");
}

function drawLabel(text, x, y, maxWidth, align) {
  ctx.font = "12px system-ui, sans-serif";
  ctx.textAlign = align;
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#f6f8fb";
  ctx.strokeText(text, x, y, maxWidth);
  ctx.fillStyle = "#19253a";
  ctx.fillText(text, x, y, maxWidth);
}

function fit() {
  scale = Math.min(2, Math.max(1, width - 32) / scene.w, Math.max(1, height - 32) / scene.h);
  offsetX = (width - scene.w * scale) / 2;
  offsetY = (height - scene.h * scale) / 2;
  draw();
}

function zoom(factor, x, y) {
  const next = Math.max(Math.min(0.03, scale), Math.min(8, scale * factor));
  offsetX = x - (x - offsetX) * next / scale;
  offsetY = y - (y - offsetY) * next / scale;
  scale = next;
  draw();
}

function select(name) {
  selected = name;
  scene = name === null ? overview : importerLayout(name);
  direct = new Set(name === null ? [] : graph[name].filter(file => file !== name));
  hover.hidden = true;
  byID("selection").textContent = name ?? "Файл не выбран";
  byID("importer-count").textContent = name === null
    ? "Нажмите на папку, чтобы раскрыть файлы. Выберите файл, чтобы увидеть его импортёров."
    : `Прямые: ${direct.size} · только транзитивные: ${scene.points.size - direct.size - 1}`;
  fit();
}

function updateSearch() {
  const query = search.value.trim().toLowerCase();
  matches = query ? names.filter(name => name.toLowerCase().includes(query)) : [];
  byID("match-count").textContent = query ? `Найдено: ${matches.length}` : "";
  results.replaceChildren(...matches.map(name => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = name;
    button.addEventListener("click", () => select(name));
    return button;
  }));
}

function nodeAt(x, y) {
  let best = null;
  let distance = Math.max(6, 7 * scale);
  for (const [name, point] of scene.points) {
    if (point.folder) continue;
    const d = Math.hypot(offsetX + point.x * scale - x, offsetY + point.y * scale - y);
    if (d < distance) {
      best = name;
      distance = d;
    }
  }
  return best;
}

function folderAt(x, y) {
  const worldX = (x - offsetX) / scale;
  const worldY = (y - offsetY) / scale;
  return scene.blocks.find(block => block.folder && worldX >= block.x && worldX <= block.x + block.w &&
    worldY >= block.y && worldY <= block.y + (block.open ? 27 : block.h));
}

function toggleFolder(folder) {
  if (expanded.has(folder.id)) expanded.delete(folder.id);
  else expanded.add(folder.id);
  overview = overviewLayout();
  select(null);
}

function cursor(event) {
  const rect = canvas.getBoundingClientRect();
  return [event.clientX - rect.left, event.clientY - rect.top];
}

search.addEventListener("input", updateSearch);
search.addEventListener("keydown", event => {
  if (event.key === "Enter" && matches.length) select(matches[0]);
});
document.addEventListener("keydown", event => { if (event.key === "Escape") select(null); });
byID("fit").addEventListener("click", () => select(null));
byID("zoom-in").addEventListener("click", () => zoom(1.25, width / 2, height / 2));
byID("zoom-out").addEventListener("click", () => zoom(0.8, width / 2, height / 2));
canvas.addEventListener("wheel", event => {
  event.preventDefault();
  zoom(event.deltaY < 0 ? 1.15 : 1 / 1.15, ...cursor(event));
}, { passive: false });
canvas.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0) return;
  const [x, y] = cursor(event);
  drag = { x, y, offsetX, offsetY };
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", event => {
  if (!event.isPrimary) return;
  const [x, y] = cursor(event);
  if (drag) {
    offsetX = drag.offsetX + x - drag.x;
    offsetY = drag.offsetY + y - drag.y;
    hover.hidden = true;
    draw();
  } else {
    const name = nodeAt(x, y);
    const block = folderAt(x, y);
    hover.hidden = name === null && !block;
    hover.textContent = block ? `${block.folder.name} · ${block.folder.files.length} файлов` : name ?? "";
  }
});
canvas.addEventListener("pointerup", event => {
  if (!event.isPrimary || !drag) return;
  const [x, y] = cursor(event);
  if (Math.hypot(x - drag.x, y - drag.y) < 4) {
    const block = folderAt(x, y);
    if (block) toggleFolder(block.folder);
    else select(nodeAt(x, y));
  }
  drag = null;
});
canvas.addEventListener("pointercancel", () => { drag = null; });
canvas.addEventListener("pointerleave", () => { hover.hidden = true; });

new ResizeObserver(() => {
  const rect = canvas.getBoundingClientRect();
  width = Math.max(1, rect.width);
  height = Math.max(1, rect.height);
  canvas.width = Math.ceil(width * window.devicePixelRatio);
  canvas.height = Math.ceil(height * window.devicePixelRatio);
  fit();
}).observe(canvas);
select(null);
</script>
</body>
</html>
